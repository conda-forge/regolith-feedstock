{% set python_min = "3.12" %}
{% set name = "regolith" %}
{% set version = "0.10.1" %}
{% set sha256 = "938b515524b954e2acaba58ff06515d2dc40653ae0f87434d606b11e42c88d23" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/r/regolith/regolith-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  preserve_egg_dir: true
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip

  run:
    - python >={{ python_min }}
    - setuptools
    - ruamel.yaml
    - ruamel.yaml.clib
    - bibtexparser
    - docutils
    - jinja2
    - cerberus
    - flatten-dict
    - xonsh
    - rever
    - openpyxl
    - pypdf
    - nameparser
    - pandas
    - pymongo
    - matplotlib-base
    - habanero
    - gooey
    - google-api-python-client
    - google-auth-oauthlib
    - wxpython

test:
  imports:
    - regolith

  requires:
    - flake8
    - mock
    - pytest
    - requests-mock
    - pytest-mock
    - pytest-env
    - coverage
    - codecov
    - python {{ python_min }}

about:
  home: https://github.com/regro/regolith/
  summary: A Research Group Content Management System
  license: 'CC0-1.0'
  license_file: LICENSE.rst
  description: |
    Keep all your info in databases and build reports such as cv, publication list and so on.
  doc_url: http://regro.github.io/regolith/
  dev_url: https://github.com/regro/regolith/

extra:
  recipe-maintainers:
    - bobleesj
    - sbillinge
